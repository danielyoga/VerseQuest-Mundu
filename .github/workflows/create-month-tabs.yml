name: Create Month Tabs

on:
  # Runs daily on days 28–31 at 23:00 UTC (06:00 Jakarta next day).
  # The endpoint itself guards against non-last-day runs, so days 28–30
  # of a 31-day month are silent no-ops.
  schedule:
    - cron: '0 23 28-31 * *'
  # Manual trigger — useful for testing or recovery.
  workflow_dispatch:
    inputs:
      force:
        description: 'Skip last-day guard (pass force=true)'
        required: false
        default: 'false'

jobs:
  create-tabs:
    runs-on: ubuntu-latest
    steps:
      - name: Create next month's sheet tabs
        run: |
          FORCE_PARAM=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_PARAM="?force=true"
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PRODUCTION_URL }}/api/cron/create-month-tabs${FORCE_PARAM}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "HTTP $HTTP_CODE"
          echo "$BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Request failed with HTTP $HTTP_CODE"
            exit 1
          fi
